name: Build & Release APK Automaticamente

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Compatível com AGP 9.1+)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar Licenças do Android SDK
        run: |
          yes | sdkmanager --licenses || true

      - name: Restaurar Keystore e Arquivos de Configuração
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Preparar APK para Download
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/escala_medina.apk

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Escala Medina - Versão Mais Recente (APK)"
          draft: false
          prerelease: false
          files: |
            output_apk/escala_medina.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
